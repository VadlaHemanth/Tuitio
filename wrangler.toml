name = "tuitio-smart-tuition"
main = "cloudflare/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "tuitio-db1"
database_id = "beb50307-24cf-4881-9c47-5369bf3deb4c"

[vars]
SESSION_SECRET = "8f9b2d3c4e5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c"

[triggers]
# Free plan allows up to 3 cron triggers per Worker.
# 12:00 UTC = 5:30 PM IST (daily tuition prep & fee reminders)
# 14:30 UTC = 8:00 PM IST (end-of-session summary & carry-forward check)
crons = ["0 12 * * *", "30 14 * * *"]
