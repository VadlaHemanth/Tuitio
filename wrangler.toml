name = "tuitio-smart-tuition"
main = "cloudflare/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "tuitio-db1"
migrations_dir = "cloudflare/migrations"
database_id = "beb50307-24cf-4881-9c47-5369bf3deb4c"

[vars]
SESSION_SECRET = "8f9b2d3c4e5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c"

[triggers]
# 5:30 PM IST daily fee alerts and tuition prep.
crons = ["0 12 * * *"]
